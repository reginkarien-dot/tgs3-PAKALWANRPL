
name: Build C++ EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        shell: pwsh
        run: |
          g++ kasir.cpp -o kasir.exe

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-kasir
          path: kasir.exe
